name: FastAPI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install poetry==2.5.1
          python -m poetry check --lock
          python -m poetry install --with dev --no-interaction

      - name: Run tests
        run: |
          python -m poetry run pytest -v
