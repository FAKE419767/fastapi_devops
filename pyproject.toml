[project]
name = "fastapi-devops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "pydantic-settings==2.16.2",
    "PyJWT==2.15.1",
    "pwdlib[argon2]==0.3.1",
    "python-multipart==0.0.33",
    "starlette==0.52.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "==9.2.0"
pytest-asyncio = "==1.4.1.post1"
httpx = "==0.28.1"
pytest-cov = "==7.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires TEST_DATABASE_URL pointing to PostgreSQL"]
